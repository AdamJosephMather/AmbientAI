[transcription]
api_key = "sk-or-v1-"
model = "openai/whisper-large-v3-turbo"
url = "https://openrouter.ai/api/v1/audio/transcriptions"
language = "en"

[chat]
api_key = "sk-or-v1-"
url = "https://openrouter.ai/api/v1/chat/completions"
temperature = 0.7
max_tokens = 16384
# Separate budget for worker reasoning and tool calls.
tool_max_tokens = 65536

[tts]
api_key = "sk-or-v1-"
url = "https://openrouter.ai/api/v1/audio/speech"

# For mode, "stream" or "sentence"
# "auto" also exists, but only works for speechify models

model = "speechify/simba-3.5"
voice = "beth"
mode = "auto"

# model = "heygen/heygen-voice-1-turbo"
# voice = "nadine"
# mode = "stream"

response_format = "pcm"

[ui]
font_size = 18 # pixels

[vad]
path = "vad/silero_vad.bin"

[ai]
ai_name = "Zoe"
user_name = "boss"

model_fast = "~deepseek/deepseek-flash-latest:latency"
model_fast_reasoning = "none"

model_smart = "~deepseek/deepseek-flash-latest"
model_smart_reasoning = "medium"

[plugins]

# Executable paths (no shell commands). Relative paths use Zoe's working directory.
# Example: paths = ["example_plugin/ambient-example-plugin.exe"]
# In this directory: example_plugin, spotify_plugin, brave_search_plugin

# Build search with: go -C brave_search_plugin build -o brave_search_plugin.exe .
# Set the Brave API key in brave_search_plugin/config.toml (see its README).

# Read the readme for spotify_plugin

paths = ["brave_search_plugin/brave_search_plugin.exe"]
call_timeout_seconds = 30

[database]

# Append-only database holding the main chat history (messages, program
# starts, compactions). Worker chats are not kept.
# The path is relative to the program's working directory.
path = "conversation.db"

# How many hours after the last message should the history be compacted
# (merged lossy-style) when the program starts.
compact_after_hours = 3
max_compaction_tokens = 16384